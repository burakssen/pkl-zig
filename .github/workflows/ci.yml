name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    timeout-minutes: 5
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src example

  unit:
    timeout-minutes: 5
    name: Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run unit tests
        run: zig build test

  integration:
    timeout-minutes: 5
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Pkl
        run: |
          curl --fail --location \
            --output pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Build integration tests
        run: zig build integration-install

      - name: Run integration tests
        run: |
          ./zig-out/bin/pkl-message-tests
          ./zig-out/bin/pkl-integration-tests
  codegen:
    timeout-minutes: 5
    name: Codegen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Pkl
        run: |
          curl --fail --location \
            --output pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Run codegen tests
        run: zig build codegen-snippet-test
