name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    timeout-minutes: 5
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig build/libpkl.zig src example

  libpkl:
    name: Native libpkl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache libpkl artifact
        id: libpkl-cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache/p/*/libpkl/build/native-libs
            ~/.cache/zig/p/*/libpkl/build/native-libs
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: libpkl-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build/libpkl.zig') }}
          restore-keys: |
            libpkl-${{ runner.os }}-

      - name: Build libpkl
        if: steps.libpkl-cache.outputs.cache-hit != 'true'
        run: zig build

  unit:
    timeout-minutes: 5
    name: Unit
    needs: [libpkl]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore libpkl artifact
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache/p/*/libpkl/build/native-libs
            ~/.cache/zig/p/*/libpkl/build/native-libs
          key: libpkl-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build/libpkl.zig') }}

      - name: Run unit tests
        run: zig build test

  integration:
    timeout-minutes: 5
    name: Integration
    needs: [libpkl]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore libpkl artifact
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache/p/*/libpkl/build/native-libs
            ~/.cache/zig/p/*/libpkl/build/native-libs
          key: libpkl-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build/libpkl.zig') }}

      - name: Install Pkl
        run: |
          curl --fail --location \
            --output pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Build integration tests
        run: zig build integration-install

      - name: Run integration tests
        run: |
          ./zig-out/bin/pkl-message-tests
          ./zig-out/bin/pkl-integration-tests
  codegen:
    timeout-minutes: 5
    name: Codegen
    needs: [libpkl]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore libpkl artifact
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache/p/*/libpkl/build/native-libs
            ~/.cache/zig/p/*/libpkl/build/native-libs
          key: libpkl-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build/libpkl.zig') }}

      - name: Install Pkl
        run: |
          curl --fail --location \
            --output pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Run codegen tests
        run: zig build codegen-snippet-test
